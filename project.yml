name: Tako
options:
  # Bundle IDs keep the old dev.hyperterm prefix on purpose: changing them would drop the user's
  # UserDefaults, notification permission and folder access (TCC), which are keyed on the ID.
  bundleIdPrefix: dev.hyperterm
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  # Embedded Chromium for the browser pane: CefSwift at a tested commit (CEF 154), vendored
  # so Tako can patch its message pump (see Packages/CefSwift/TAKO-PATCHES.md).
  CefSwift:
    path: Packages/CefSwift
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Tako:
    type: application
    platform: macOS
    sources:
      - path: Sources/Tako
      - path: Sources/Shared
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
      - path: Resources/terminfo
        type: folder
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      # Tako's mark and the agents' logos: scripts/make-icon.sh
      - path: Resources/Mark
        type: folder
        buildPhase: resources
    dependencies:
      - framework: GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Carbon.framework
      - sdk: UserNotifications.framework
      - sdk: libc++.tbd
      - sdk: libsqlite3.tbd
      - target: ht
        embed: false
        link: false
      - target: TakoHelper
        embed: false
        link: false
      - package: CefSwift
        product: CefSwiftUI
    info:
      path: Sources/Tako/App/Info.plist
      properties:
        CFBundleName: Tako
        CFBundleDisplayName: Tako
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
        # Chromium's allocator is incompatible with the Nano malloc zone.
        LSEnvironment:
          MallocNanoZone: "0"
        NSSupportsAutomaticGraphicsSwitching: true
        # Keep the pre-Liquid Glass window chrome (flush sidebar, plain toolbar items) when
        # built with the macOS 26+ SDK, so every build looks the same.
        UIDesignRequiresCompatibility: true
        # Tako Link (off by default): Bonjour discovery of friends' Takos on the same network.
        NSLocalNetworkUsageDescription: "Tako Link lets Tako find your friends' Takos on this network, so your Sumis can message each other."
        NSBonjourServices:
          - _tako._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hyperterm.app
        PRODUCT_NAME: Tako
        OTHER_LDFLAGS: "-lc++"
      # The debug build runs next to the installed app, so it keeps its own preferences.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.hyperterm.app.dev
    postBuildScripts:
      - name: Embed ht CLI
        script: |
          set -e
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin"
          cp -f "$BUILT_PRODUCTS_DIR/ht" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin/ht"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin/ht"
        basedOnDependencyAnalysis: false
      - name: Copy Tako terminal defaults
        script: |
          # The tracked config files are the source of truth; Resources/ghostty is only refreshed
          # when libghostty is rebuilt, so copy them into the bundle on every build.
          cp -f "$SRCROOT/Resources/tako-style.conf" "$SRCROOT/Resources/tako-defaults.conf" \
            "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/ghostty/"
        basedOnDependencyAnalysis: false
      - name: Embed Chromium
        script: |
          "$SRCROOT/scripts/embed-cef.sh"
        basedOnDependencyAnalysis: false
  # Chromium's renderer/GPU/utility processes; embed-cef.sh copies it into five helper apps.
  TakoHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/TakoHelper
    dependencies:
      - package: CefSwift
        product: CefKit
    settings:
      base:
        PRODUCT_NAME: TakoHelper
  ht:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ht
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: ht
  TakoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TakoTests
    dependencies:
      - target: Tako
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tako.app/Contents/MacOS/Tako"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tako:
    build:
      targets:
        Tako: all
        ht: all
    test:
      targets:
        - TakoTests
