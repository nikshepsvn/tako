# Loaded before the user's Ghostty config, so any of these they set themselves wins.

# Tako's ink look: terminals are warm sumi-black panes with bone text and a bone cursor;
# nothing red, since red in a terminal reads as an error. Text gets room to breathe.
window-padding-x = 14
window-padding-y = 10
window-padding-balance = true
background = 121110
foreground = e8e3d8
background-opacity = 1
cursor-color = e8e3d8
cursor-style = bar
selection-background = 3a3631
selection-foreground = f3eee4
adjust-cell-height = 8%

# Scrollback per terminal, in bytes (Ghostty's own default is 10 MB). With a dozen tiles open
# that adds up; about 3 MB still holds tens of thousands of lines.
scrollback-limit = 3000000
