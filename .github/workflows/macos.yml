name: macOS build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # libghostty is SDK-independent, and Zig 0.15 can't link against the macOS 26 SDK: build it
  # once here with Xcode 16 and let every build job restore it. Built only when the build
  # script changes; otherwise this job just confirms the cache is there.
  ghosttykit:
    name: libghostty
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache libghostty
        id: ghostty
        uses: actions/cache@v4
        with:
          path: |
            GhosttyKit.xcframework
            Resources/ghostty
            Resources/terminfo
          key: ghosttykit-${{ hashFiles('scripts/build-ghosttykit.sh') }}

      - name: Build libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          curl -fsSL https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz | tar xJ -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/zig-aarch64-macos-0.15.2:$PATH"
          scripts/build-ghosttykit.sh

  build:
    name: build (${{ matrix.os }})
    needs: ghosttykit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: Xcode_16
          # Xcode 26 compiles the Liquid Glass paths (#if compiler(>=6.2)).
          - os: macos-26
            xcode: Xcode_26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/${{ matrix.xcode }}*.app | sort -V | tail -1)"
          xcodebuild -version
          # Xcode 26 ships the Metal toolchain separately; libghostty's shaders need it.
          if [ "${{ matrix.os }}" = "macos-26" ]; then xcodebuild -downloadComponent MetalToolchain || true; fi

      - name: Tools
        run: brew install xcodegen

      - name: Restore libghostty
        uses: actions/cache/restore@v4
        with:
          path: |
            GhosttyKit.xcframework
            Resources/ghostty
            Resources/terminfo
          key: ghosttykit-${{ hashFiles('scripts/build-ghosttykit.sh') }}
          fail-on-cache-miss: true

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Tako/cef
          key: cef-${{ hashFiles('scripts/embed-cef.sh') }}

      - name: Build
        run: |
          xcodegen generate
          set -o pipefail
          xcodebuild -project Tako.xcodeproj -scheme Tako -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|warning: .*Sources/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Test
        env:
          # The snapshot test renders the real views to PNGs for visual review.
          TEST_RUNNER_TAKO_CAPTURE_UI: ${{ github.workspace }}/captures
        run: |
          set -o pipefail
          xcodebuild -project Tako.xcodeproj -scheme Tako -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO test 2>&1 \
            | tee test.log | grep -E "error:|Test Case .* failed|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Upload interface captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-captures-${{ matrix.os }}
          path: captures
          if-no-files-found: ignore
