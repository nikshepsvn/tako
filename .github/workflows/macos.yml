name: macOS build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: Xcode_16
          # Xcode 26 compiles the Liquid Glass paths (#if compiler(>=6.2)).
          - os: macos-26
            xcode: Xcode_26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/${{ matrix.xcode }}*.app | sort -V | tail -1)"
          xcodebuild -version
          # Xcode 26 ships the Metal toolchain separately; libghostty's shaders need it.
          if [ "${{ matrix.os }}" = "macos-26" ]; then xcodebuild -downloadComponent MetalToolchain || true; fi

      - name: Tools
        run: |
          brew install xcodegen
          curl -fsSL https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.15.2" >> "$GITHUB_PATH"

      - name: Cache libghostty
        id: ghostty
        uses: actions/cache@v4
        with:
          path: |
            GhosttyKit.xcframework
            Resources/ghostty
            Resources/terminfo
          key: ghosttykit-${{ hashFiles('scripts/build-ghosttykit.sh') }}

      - name: Build libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: |
          # Zig 0.15 can't link against the macOS 26 SDK yet; libghostty is SDK-independent, so
          # build it with Xcode 16 wherever that's installed.
          OLD=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$OLD" ]; then export DEVELOPER_DIR="$OLD/Contents/Developer"; fi
          scripts/build-ghosttykit.sh

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Hyperterm/cef
          key: cef-${{ hashFiles('scripts/embed-cef.sh') }}

      - name: Build
        run: |
          xcodegen generate
          set -o pipefail
          xcodebuild -project Hyperterm.xcodeproj -scheme Hyperterm -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|warning: .*Sources/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Test
        env:
          # The snapshot test renders the real views to PNGs for visual review.
          TEST_RUNNER_HYPERTERM_CAPTURE_UI: ${{ github.workspace }}/captures
        run: |
          set -o pipefail
          xcodebuild -project Hyperterm.xcodeproj -scheme Hyperterm -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO test 2>&1 \
            | tee test.log | grep -E "error:|Test Case .* failed|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Upload interface captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-captures-${{ matrix.os }}
          path: captures
          if-no-files-found: ignore

      # A ready-to-run app, so Kuronami can be installed without Xcode (see README).
      - name: Package app
        if: matrix.os == 'macos-15'
        run: |
          set -o pipefail
          xcodebuild -project Hyperterm.xcodeproj -scheme Hyperterm -configuration Release \
            -derivedDataPath build/DerivedData build 2>&1 \
            | tee release.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" release.log
          # ditto keeps the Chromium framework's symlinks, which upload-artifact's zip would not.
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release/Kuronami.app Kuronami.zip

      - name: Upload app
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: Kuronami-app
          path: Kuronami.zip
          compression-level: 0
